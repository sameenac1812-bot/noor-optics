<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Sattva Tiffins – Menu</title>
  <meta name="description" content="Pure Taste, Freshly Made Always at Sattva Tiffins. Browse our authentic South Indian menu." />
  <meta name="theme-color" content="#021f4d" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css?v=25" />
  <link rel="stylesheet" href="menu.css?v=25" />
</head>
<body>

<!-- ═══ STORE HEADER ════════════════════════════════════════════ -->
<header class="store-header" id="store-header">
  <div class="store-header-inner">
    <div class="store-brand">
      <div class="store-logo" id="store-logo-img"></div>
      <div class="store-info">
        <h1 class="store-name" id="store-name-text">Sattva Tiffins</h1>
        <p class="store-tagline" id="store-tagline-text">Pure Taste · Freshly Made · Always</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-ghost btn-icon" id="search-toggle-btn" aria-label="Search" title="Search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </button>
      <button class="btn-ghost btn-icon" id="info-btn" aria-label="Store info">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      </button>
    </div>
  </div>

  <!-- Search bar -->
  <div class="search-bar-wrap" id="search-bar-wrap">
    <div class="search-bar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="search" id="search-input" placeholder="Search dishes…" autocomplete="off" />
      <button class="search-clear" id="search-clear-btn" aria-label="Clear search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- ═══ HERO BANNER ═════════════════════════════════════════════ -->
<section class="hero-section" id="hero-section">
  <div class="hero-image-wrap" id="hero-image-wrap">
    <div class="hero-gradient"></div>
  </div>
</section>

<!-- ═══ FILTERS ROW ══════════════════════════════════════════════ -->
<div class="filters-row" id="filters-row">
  <label class="veg-toggle-label" id="veg-filter-wrap">
    <span class="veg-dot veg"></span>
    <span class="filter-label-text">Veg Only</span>
    <label class="toggle" style="margin-left:6px">
      <input type="checkbox" id="veg-filter" />
      <span class="toggle-slider"></span>
    </label>
  </label>
  <div class="filter-pills" id="filter-pills">
    <button class="filter-pill active" data-filter="all">All</button>
    <button class="filter-pill" data-filter="bestseller">🔥 Bestsellers</button>
    <button class="filter-pill" data-filter="new">✨ New</button>
  </div>
</div>

<!-- ═══ CATEGORY NAVBAR (Sticky) ════════════════════════════════ -->
<nav class="category-nav" id="category-nav" aria-label="Menu categories">
  <div class="category-nav-inner" id="category-nav-inner" role="list">
    <!-- generated by JS -->
  </div>
</nav>

<!-- ═══ MENU CONTENT ════════════════════════════════════════════ -->
<main class="menu-main" id="menu-main">
  <div id="search-results-banner" class="search-results-banner hidden">
    <span id="search-results-text"></span>
    <button id="clear-search-btn" class="btn btn-sm btn-outline">Clear</button>
  </div>
  <div id="menu-sections">
    <!-- generated by JS -->
  </div>
</main>

<!-- ═══ CART BAR (fixed bottom) ══════════════════════════════════ -->
<div class="cart-bar hidden" id="cart-bar">
  <div class="cart-bar-inner" id="open-cart-btn">
    <div class="cart-bar-left">
      <div class="cart-count-badge" id="cart-count-badge">0</div>
      <span class="cart-bar-label">items added</span>
    </div>
    <div class="cart-bar-total" id="cart-bar-total">
      ₹0
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </div>
  </div>
</div>

<!-- ═══ ITEM DETAIL MODAL ════════════════════════════════════════ -->
<div class="modal-backdrop" id="item-modal" role="dialog" aria-modal="true" aria-labelledby="item-modal-title">
  <div class="modal item-modal-inner" id="item-modal-box">
    <div class="modal-handle"></div>
    <div class="item-modal-image-wrap" id="item-modal-img-wrap">
      <button class="item-modal-close" id="item-modal-close" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <div class="item-modal-img-placeholder" id="item-modal-img-placeholder">🍽️</div>
      <img id="item-modal-img" class="item-modal-img hidden" alt="" />
    </div>
    <div class="item-modal-body">
      <div class="item-modal-meta">
        <span id="item-modal-veg-dot" class="veg-dot veg"></span>
        <span id="item-modal-badges"></span>
      </div>
      <h2 class="item-modal-name" id="item-modal-title"></h2>
      <p class="item-modal-desc" id="item-modal-desc"></p>
      <div class="item-modal-price-row">
        <span class="price" id="item-modal-price"></span>
        <span class="price-original" id="item-modal-original-price"></span>
        <span class="price-savings" id="item-modal-savings"></span>
      </div>
      <div class="customization-section" id="customization-section">
        <h3 class="customization-title">Customise your order</h3>
        <div id="customization-options"></div>
      </div>
    </div>
    <div class="item-modal-footer">
      <div class="modal-qty-control">
        <div class="qty-control">
          <button class="qty-btn" id="modal-qty-minus" aria-label="Decrease quantity">−</button>
          <span class="qty-count" id="modal-qty-count">1</span>
          <button class="qty-btn" id="modal-qty-plus" aria-label="Increase quantity">+</button>
        </div>
      </div>
      <button class="btn btn-primary modal-add-btn" id="modal-add-btn">
        Add to Cart · <span id="modal-add-price"></span>
      </button>
    </div>
  </div>
</div>

<!-- ═══ CART DRAWER MODAL ════════════════════════════════════════ -->
<div class="modal-backdrop" id="cart-modal" role="dialog" aria-modal="true" aria-labelledby="cart-modal-title">
  <div class="modal cart-modal-inner">
    <div class="modal-handle"></div>
    <div class="modal-header cart-modal-header">
      <div style="display:flex;align-items:center;gap:8px">
        <h2 class="modal-title" id="cart-modal-title">Your Cart</h2>
        <span class="cart-items-count-badge" id="cart-modal-count-badge">0 items</span>
      </div>
      <button class="btn-ghost btn-icon" id="cart-modal-close" aria-label="Close cart">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- Scrollable container for items and order details -->
    <div class="cart-modal-scroll" id="cart-modal-scroll">
      <div class="cart-section-title" id="cart-section-title">
        <span>Items in Your Order</span>
        <button type="button" class="cart-add-more-link" id="cart-add-more-btn">+ Add More Items</button>
      </div>

      <div class="cart-items-wrap" id="cart-items-wrap">
        <!-- generated by JS -->
      </div>

      <div class="cart-footer" id="cart-footer">
        <div class="cart-summary">
          <div class="cart-summary-row">
            <span>Subtotal</span><span id="cart-subtotal">₹0</span>
          </div>
          <div class="cart-summary-divider"></div>
          <div class="cart-summary-row total">
            <span>Total</span><span id="cart-total">₹0</span>
          </div>
        </div>

        <!-- Customer Details Section (Name, Phone & Table) -->
        <div class="cart-customer-section" id="cart-customer-section" style="background:#f8f9fa;padding:14px;border-radius:14px;border:1.5px solid var(--border);margin-bottom:14px;display:flex;flex-direction:column;gap:12px">
          <!-- Name Field -->
          <div>
            <label class="form-label" for="customer-name-input" style="font-size:0.82rem;font-weight:700;color:#1e293b;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between">
              <span>👤 Your Name</span>
              <span style="font-size:0.72rem;color:var(--text-muted);font-weight:500">For bill & token</span>
            </label>
            <input type="text" class="form-input" id="customer-name-input" placeholder="e.g. Rahul / Guest" style="margin-top:2px;font-weight:600;font-size:0.92rem;background:#fff;border-radius:8px;padding:9px 12px;border:1.5px solid #cbd5e1;width:100%" autocomplete="name" />
          </div>

          <!-- Phone Number Field -->
          <div>
            <label class="form-label" for="customer-phone-input" style="font-size:0.82rem;font-weight:700;color:#1e293b;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between">
              <span>📞 Phone Number</span>
              <span style="font-size:0.72rem;color:var(--text-muted);font-weight:500">10-digit mobile</span>
            </label>
            <input type="tel" class="form-input" id="customer-phone-input" placeholder="e.g. 9876543210" maxlength="10" style="margin-top:2px;font-weight:600;font-size:0.92rem;background:#fff;border-radius:8px;padding:9px 12px;border:1.5px solid #cbd5e1;width:100%" autocomplete="tel" inputmode="numeric" />
          </div>

          <!-- Table / Seat Section -->
          <div>
            <label class="form-label" for="customer-table-input" style="font-size:0.82rem;font-weight:700;color:#1e293b;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between">
              <span>🪑 Table / Seat Number</span>
              <span style="font-size:0.72rem;color:var(--text-muted);font-weight:400">Dine-in / Counter</span>
            </label>
            <input type="text" class="form-input" id="customer-table-input" placeholder="e.g. Table 4 or Counter" style="margin-top:2px;font-weight:600;font-size:0.92rem;background:#fff;border-radius:8px;padding:9px 12px;border:1.5px solid #cbd5e1;width:100%" />
          </div>
        </div>

        <!-- Payment Option: Cash or UPI -->
        <div class="cart-payment-section">
          <label class="form-label" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
            <span style="font-weight:700;font-size:0.84rem;color:#3d4152">💳 How will you pay?</span>
            <span style="font-size:0.72rem;color:var(--text-muted)">Pay at counter</span>
          </label>
          <div class="payment-method-selector" role="radiogroup" aria-label="Payment Method">
            <label class="payment-option-card active" id="pay-opt-cash" data-method="cash">
              <input type="radio" name="order-payment-method" id="pay-method-cash" value="cash" checked style="position:absolute;opacity:0;pointer-events:none" />
              <div class="pay-option-icon">💵</div>
              <div class="pay-option-text">
                <div class="pay-option-title">Cash</div>
                <div class="pay-option-sub">Pay at counter</div>
              </div>
              <div class="pay-option-radio"></div>
            </label>
            <label class="payment-option-card" id="pay-opt-upi" data-method="upi">
              <input type="radio" name="order-payment-method" id="pay-method-upi" value="upi" style="position:absolute;opacity:0;pointer-events:none" />
              <div class="pay-option-icon">📱</div>
              <div class="pay-option-text">
                <div class="pay-option-title">UPI</div>
                <div class="pay-option-sub">Scan QR at counter</div>
              </div>
              <div class="pay-option-radio"></div>
            </label>
          </div>
        </div>
      </div>
    </div>

    <!-- Sticky Bottom Bar with Order Button -->
    <div class="cart-sticky-bottom" id="cart-sticky-bottom">
      <button class="btn btn-primary btn-lg w-full" id="place-order-btn">
        Place Order · <span id="place-order-total">₹0</span>
      </button>
    </div>
  </div>
</div>

<!-- ═══ STORE INFO MODAL ═════════════════════════════════════════ -->
<div class="modal-backdrop" id="info-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <h2 class="modal-title">Store Information</h2>
      <button class="btn-ghost btn-icon" id="info-modal-close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body" id="info-modal-body">
      <!-- generated by JS -->
    </div>
  </div>
</div>

<!-- ═══ ORDER SUCCESS MODAL ══════════════════════════════════════ -->
<div class="modal-backdrop" id="order-success-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-body order-success-body">
      <div class="success-animation">
        <div class="success-check">✓</div>
      </div>
      <h2 class="success-title">Order Placed! 🎉</h2>
      <p class="success-subtitle" id="success-order-id"></p>
      <p class="success-message">Your order is being prepared. We'll notify you when it's ready!</p>
      <div class="success-order-summary" id="success-order-summary"></div>
      <button class="btn btn-primary btn-lg w-full" id="order-success-done">Back to Menu</button>
    </div>
  </div>
</div>

<!-- ═══ TOAST CONTAINER ══════════════════════════════════════════ -->
<div class="toast-container" id="toast-container" aria-live="polite"></div>

<script src="data.js?v=31"></script>
<script src="supabase.js?v=31"></script>
<script src="menu.js?v=31"></script>
</body>
</html>
